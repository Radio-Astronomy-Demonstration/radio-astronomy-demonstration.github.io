<h1>How to use the RAD kit</h1>

<h2>Assembly</h2>

<h3>Putting in the batteries</h3>

<div class="img-container">
    <figure>
        <img src="/media/assembly-photos/circuit-board-no-batteries-annotated.jpg" width="100%" alt="The circuit board without batteries">
        <figcaption>
            <p>Put two AA batteries into the battery holder, ensuring that the positive (pointy) ends of the battery face towards the on/off switch. <em class="img-credit">Image credit: McGill Radio Lab</em></p>
        </figcaption>
    </figure>

    <figure>
        <img src="/media/assembly-photos/circuit-board-on-annotated.jpg" width="100%" alt="The circuit board with batteries">
        <figcaption>
            <p>To test that the circuit board works, turn the switch in the bottom right corner from off to on. Locate the microphone, lights, mode display, and mode switcher on the circuit board. <em class="img-credit">Image credit: McGill Radio Lab</em></p>
        </figcaption>
    </figure>   
</div>

<h3>Assembling the ALBATROS model</h3>

<div class="img-container">
    <figure style="flex: 36%;">
        <img src="/media/assembly-photos/albatros-components.jpg" width="100%" alt="Components of the ALBATROS model.">
        <figcaption>
            <p> There are seven acrylic components needed to assemble the ALBATROS model: four triangular pieces, two armed pieces, and one base. <em class="img-credit">Image credit: McGill Radio Lab</em></p>
        </figcaption>
    </figure>

    <figure style="flex: 64%;">
        <img src="/media/assembly-photos/albatros-partially-assembled.jpg" width="100%" alt="Partially assembled ALBATROS model.">
        <figcaption>
            <p> Two triangular pieces should be slotted onto each of the armed pieces. <em class="img-credit">Image credit: McGill Radio Lab</em></p>
        </figcaption>
    </figure>   
</div>

<div class="img-container">
    <figure style="flex: 30%;">
        <img src="/media/assembly-photos/albatros-tree-side-view.jpg" width="100%" alt="ALBATROS model top.">
        <figcaption>
            <p>The two triangular pieces should be slotted together. <em class="img-credit">Image credit: McGill Radio Lab</em></p>
        </figcaption>
    </figure>

    <figure style="flex: 70%;">
        <img src="/media/assembly-photos/albatros-bottom-side-view.jpg" width="100%" alt="ALBATROS model bottom.">
        <figcaption>
            <p> Align the circuit board on the acrylic base, making sure to line up the corners that have been cut off. <em class="img-credit">Image credit: McGill Radio Lab</em></p>
        </figcaption>
    </figure>   
</div>

<div class="img-container">
    <figure>
        <img src="/media/assembly-photos/albatros-side-view.jpg" width="100%" alt="Side view of fully assembled ALBATROS model.">
        <figcaption>
            <p>Put the top of the ALBATROS model on the base. <em class="img-credit">Image credit: McGill Radio Lab</em></p>
        </figcaption>
    </figure>

    <figure>
        <img src="/media/assembly-photos/albatros-on.jpg" width="100%" alt="ALBATROS model bottom.">
        <figcaption>
            <p> The turned on circuit board with the ALBATROSS model on top. <em class="img-credit">Image credit: McGill Radio Lab</em></p>
        </figcaption>
    </figure>   
</div>

<h3>Assembling the MIST model</h3>

        <img src="/media/assembly-photos/mist-bottom.jpg" width="100%" alt="Bottom of the MIST model.">

    </figure>   
</div>

<div class="img-container">
    <figure>
        <img src="/media/assembly-photos/mist-partially-assembled.jpg" width="100%" alt="Partially assembled MIST model.">

        </figcaption>
    </figure>

    <figure>
        <img src="/media/assembly-photos/mist-on.jpg" width="100%" alt="Fully assembled MIST model.">
        <figcaption>
            <p> Put the rectangular pieces on top of the wall pieces. <em class="img-credit">Image credit: McGill Radio Lab</em></p>
        </figcaption>
    </figure>   
</div>
